services:
  - type: web
    name: mexc-zero-fee-grid-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: BOT_MODE
        value: DEMO
      - key: SYMBOL
        value: SOLUSDT
      - key: INITIAL_USDT
        value: "1000.0"
